name: Validate Legal Feed
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:local
      - name: Local authenticated API integration tests
        run: |
          python3 - <<'PYENV'
          import secrets
          from pathlib import Path
          Path('.dev.vars').write_text('SITE_URL=http://localhost:5173\nAUTH_MAIL_TEST_STORE=true\nAUTH_SECRET='+secrets.token_hex(32)+'\n')
          PYENV
          npm run dev > /tmp/legal-feed-dev.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:5173/ >/dev/null; then break; fi
            sleep 1
          done
          npm run test:api
      - run: npm run build
